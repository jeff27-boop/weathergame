<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How's the Weather in Taiwan?</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#dff4ff,#f8fbff);
    color:#17324d;overflow:hidden;
  }
  .app{height:100vh;display:flex;flex-direction:column;padding:10px;gap:8px}
  header{
    background:rgba(255,255,255,.95);border-radius:18px;padding:9px 16px;
    box-shadow:0 5px 16px rgba(0,0,0,.12);text-align:center;z-index:5
  }
  h1{margin:0;font-size:clamp(22px,3vw,38px);color:#1464a0}
  .qa{font-size:clamp(16px,2vw,25px);font-weight:700;margin-top:4px}
  .qa span{color:#e66b21}
  .game{
    flex:1;min-height:0;position:relative;display:flex;justify-content:center;
    align-items:center;overflow:hidden;border-radius:22px;
  }
  .board-wrap{
    position:relative;width:min(92vw,720px);height:min(78vh,820px);
    display:flex;justify-content:center;align-items:center;
  }
  .map{
    width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 8px rgba(0,0,0,.22));
    user-select:none;-webkit-user-drag:none;
  }
  .route{
    position:absolute;inset:5% 13% 5% 13%;pointer-events:none;
  }
  .node{
    position:absolute;width:30px;height:30px;border-radius:50%;
    background:transparent;border:0;box-shadow:none;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:transparent;font-size:0;z-index:6;
    opacity:0;
  }
  .node.start,.node.finish{box-shadow:none}
  /* Invisible in normal play; in Edit Mode it remains invisible but draggable. */
  .edit-on .node{
    opacity:1;cursor:grab;pointer-events:auto;
    width:22px;height:22px;
    background:rgba(20,100,160,.20);
    border:2px dashed #1464a0;
    color:#1464a0;font-size:9px;
  }
  .edit-on .node:active{cursor:grabbing;background:rgba(20,100,160,.35)}
  .weather{
    position:absolute;width:44px;height:44px;object-fit:contain;
    filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));
    pointer-events:none;z-index:7;
    transition:transform .2s; touch-action:none;
  }
  .weather:hover{transform:scale(1.05)}
  .student{
    position:absolute;width:44px;height:58px;object-fit:contain;z-index:10;
    filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));
    cursor:pointer;user-select:none;-webkit-user-drag:none;
    transition:left .75s cubic-bezier(.2,.85,.3,1),top .75s cubic-bezier(.2,.85,.3,1),
               transform .2s;
  }
  .student:hover{transform:translateY(-5px) scale(1.04)}
  .student.moving{animation:bounce .75s ease}
  @keyframes bounce{
    0%{transform:translateY(0) scale(1)}
    45%{transform:translateY(-12px) scale(1.06)}
    100%{transform:translateY(0) scale(1)}
  }
  .label{
    position:absolute;z-index:12;background:rgba(255,255,255,.95);
    border-radius:10px;padding:4px 7px;font-size:12px;font-weight:800;
    box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:none;
  }
  .info{
    position:absolute;left:12px;bottom:12px;z-index:20;
    background:rgba(255,255,255,.95);border-radius:16px;padding:10px 14px;
    box-shadow:0 5px 15px rgba(0,0,0,.16);min-width:210px;
  }
  .current{font-size:18px;font-weight:900;color:#1464a0}
  .weather-name{font-size:20px;font-weight:900;color:#e66b21}
  .hint{font-size:12px;color:#5a6c78;margin-top:3px}
  .legend{
    position:absolute;right:12px;bottom:12px;z-index:20;
    display:flex;gap:8px;background:rgba(255,255,255,.92);
    padding:8px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)
  }
  .legend-item{display:flex;align-items:center;gap:4px;font-weight:800;font-size:13px}
  .dot{width:14px;height:14px;border-radius:50%}
  .boydot{background:#3987d6}.girldot{background:#ef78a8}
  .toast{
    position:absolute;top:15px;left:50%;transform:translateX(-50%) translateY(-20px);
    opacity:0;background:rgba(24,72,104,.96);color:#fff;padding:10px 18px;
    border-radius:14px;font-weight:900;font-size:18px;z-index:50;
    transition:.25s;pointer-events:none;text-align:center
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .win{
    position:absolute;inset:0;background:rgba(10,35,60,.42);z-index:60;
    display:flex;align-items:center;justify-content:center;pointer-events:none;
    opacity:0;transition:.25s
  }
  .win.show{opacity:1}
  .win-card{
    background:white;border-radius:25px;padding:24px 30px;text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.3);font-size:clamp(24px,4vw,44px);
    font-weight:900;color:#1464a0
  }
  .win-card small{display:block;font-size:16px;color:#566;margin-top:8px}
  .try-again{
    margin-top:16px;border:0;border-radius:14px;padding:11px 20px;
    font-size:18px;font-weight:900;background:#1464a0;color:white;
    cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.18);
    pointer-events:auto
  }
  .try-again:hover{transform:translateY(-1px)}
  .win.show{pointer-events:auto}
  @media(max-width:700px){
    .app{padding:6px}
    .student{width:38px;height:50px}
    .weather{width:38px;height:38px}
    .node{width:28px;height:28px;font-size:12px}
    .info{left:6px;bottom:6px;min-width:175px}
    .legend{right:6px;bottom:6px}
  }

  .edit-toggle{
    position:absolute;right:12px;top:12px;z-index:80;border:0;border-radius:12px;
    padding:9px 13px;font-weight:900;cursor:pointer;background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.18);color:#1464a0
  }
  .editor{
    display:none;position:absolute;right:12px;top:58px;z-index:79;width:260px;
    max-height:310px;overflow:hidden;background:rgba(255,255,255,.97);
    border-radius:14px;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.22)
  }
  .editor-head{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:8px 9px;background:#eaf6ff;cursor:move;user-select:none;
    border-bottom:1px solid #cfe2ef
  }
  .editor-head h3{margin:0!important;font-size:14px!important}
  .mini-btn{border:0;background:white;border-radius:7px;padding:4px 7px;font-weight:900;cursor:pointer}
  .editor-body{padding:8px;max-height:265px;overflow:auto}
  .editor.minimized{width:185px;max-height:none}
  .editor.minimized .editor-body{display:none}
  .editor.show{display:block}
  .editor h3{margin:0 0 8px;color:#1464a0}
  .editor p{font-size:12px;margin:5px 0 10px;line-height:1.35}
  .coord-row{display:grid;grid-template-columns:1fr 52px 52px;gap:4px;align-items:center;margin:3px 0;font-size:11px}
  .coord-row input{width:100%;padding:5px;border:1px solid #b9cbd8;border-radius:7px}
  .editor-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .editor-actions button{border:0;border-radius:9px;padding:7px 9px;font-weight:800;cursor:pointer}
  .copybtn{background:#1464a0;color:white}.resetbtn{background:#eee;color:#333}
  .dragging{outline:none}
  .coord-tag{
    position:absolute;z-index:30;background:#142f45;color:white;border-radius:6px;
    padding:2px 5px;font-size:10px;font-weight:bold;pointer-events:none;display:none
  }
  .edit-on .coord-tag{display:block}
  .edit-on .node{cursor:grab;pointer-events:auto}
  .edit-on .weather{
    opacity:.9;pointer-events:auto;cursor:move;
    outline:2px dashed rgba(230,107,33,.65);
    outline-offset:2px;border-radius:8px
  }
  .codebox{width:100%;height:75px;margin-top:6px;font-family:monospace;font-size:9px}

</style>

<style>
/* V12 hard click-lock:
   The entire map/route layer is non-interactive in normal play.
   Only student images and the Edit Mode button can receive clicks. */
#route, .route {
  pointer-events: none !important;
}
#route .node, #route .weather, #route .coord-tag, #route .place-label {
  pointer-events: none !important;
}
.student {
  pointer-events: none !important;
}
#editToggle {
  pointer-events: auto !important;
}

/* When Edit Mode is ON, only editing targets are re-enabled. */
.edit-on #route .node,
.edit-on #route .weather,
.edit-on #route .coord-tag {
  pointer-events: auto !important;
}
</style>


<style>
/* V13: tiny dedicated click zones. The map and student PNG rectangles themselves are NOT clickable. */
.student { pointer-events:none !important; }
.student-hit{
  position:absolute;
  width:26px;
  height:38px;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  z-index:30;
  cursor:pointer;
  pointer-events:auto !important;
  touch-action:manipulation;
}
</style>


<style>
/* V14 controls: the game map is display-only during normal play. */
.student, .weather, .node, .coord-tag, .place-label, #route, .route, .map-img {
  pointer-events:none !important;
}
.player-controls{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  z-index:60;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
  padding:8px 6px;
  border-radius:16px;
  background:rgba(255,255,255,.92);
  box-shadow:0 3px 12px rgba(0,0,0,.18);
  pointer-events:auto !important;
}
.player-controls-title{
  font-size:11px;
  font-weight:900;
  letter-spacing:.8px;
  color:#455;
}
.face-control{
  width:58px;
  min-height:67px;
  border:2px solid rgba(20,100,160,.22);
  border-radius:14px;
  background:white;
  padding:3px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  pointer-events:auto !important;
  touch-action:manipulation;
}
.face-control img{
  width:44px;
  height:44px;
  object-fit:cover;
  object-position:50% 12%;
  border-radius:50%;
  pointer-events:none;
}
.face-control span{
  font-size:10px;
  font-weight:900;
  pointer-events:none;
}
.face-control:active{transform:scale(.95)}
#editToggle{pointer-events:auto !important}

/* Editing controls become interactive only in Edit Mode. */
.edit-on #route .node,
.edit-on #route .weather,
.edit-on #route .coord-tag{
  pointer-events:auto !important;
}

@media(max-width:650px){
  .player-controls{left:4px;padding:5px 3px;gap:5px}
  .face-control{width:48px;min-height:57px}
  .face-control img{width:36px;height:36px}
}
</style>


<style>
html, body, button, input, textarea, select, .qa, .player-controls, .editor {
  font-family: "Comic Sans MS", "Comic Sans", cursive !important;
}
</style>


<style>
#editToggle{
  position:absolute !important;
  top:8px !important;
  right:8px !important;
  left:auto !important;
  bottom:auto !important;
  width:44px !important;
  height:44px !important;
  min-width:44px !important;
  padding:0 !important;
  border-radius:50% !important;
  font-size:24px !important;
  line-height:1 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  z-index:100 !important;
}
</style>


<style>
.face-control{
  width:56px !important;
  min-height:56px !important;
  height:56px !important;
  padding:4px !important;
  border-radius:50% !important;
}
.face-control img{
  width:46px !important;
  height:46px !important;
  border-radius:50% !important;
  object-fit:cover !important;
  object-position:50% 8% !important;
  transform:scale(1.75) !important;
  transform-origin:50% 15% !important;
  clip-path:circle(28% at 50% 23%) !important;
}
.face-control span{display:none !important;}
.player-controls-title{display:none !important;}
.player-controls{
  gap:10px !important;
  padding:7px !important;
  border-radius:30px !important;
}
</style>


<style>
.win-card{
  text-align:center !important;
  padding:24px 30px !important;
  min-width:250px;
}
.great-job{
  font-family:"Comic Sans MS","Comic Sans",cursive !important;
  font-size:36px;
  font-weight:900;
  margin-bottom:10px;
}
.winner-picture{
  display:block;
  width:105px;
  height:135px;
  object-fit:contain;
  margin:0 auto 14px;
}
.try-again{
  display:block;
  margin:8px auto 0 !important;
  font-family:"Comic Sans MS","Comic Sans",cursive !important;
}
</style>


<style>
/* Final player controls: whole-body pictures only, no Boy/Girl words. */
.face-control{
  width:66px !important;
  height:82px !important;
  min-height:82px !important;
  border-radius:14px !important;
  padding:3px !important;
  overflow:hidden !important;
}
.face-control img{
  width:58px !important;
  height:74px !important;
  object-fit:contain !important;
  object-position:center !important;
  border-radius:0 !important;
  transform:none !important;
  clip-path:none !important;
}
.face-control span,
.player-controls-title{
  display:none !important;
}

/* Settings is gear only. */
#editToggle{
  font-size:0 !important;
}
#editToggle::before{
  content:"⚙️";
  font-size:25px;
  line-height:1;
}
</style>


<style>
.legend,
.legend *,
[class*="legend"]:not(.player-controls),
[class*="legend"]:not(.player-controls) * {
  display:none !important;
  visibility:hidden !important;
  pointer-events:none !important;
}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="qa">Q: How’s the weather? &nbsp; <span>A: It’s ______ in ______.</span></div>
  </header>

  <main class="game">
    <div class="board-wrap" id="board">

      <button class="edit-toggle" id="editToggle">⚙️</button>
      <div class="editor" id="editor">
        <div class="editor-head" id="editorHead">
          <h3>🛠 Map Editor</h3>
          <button class="mini-btn" id="minimizeEditor" title="Minimize">−</button>
        </div>
        <div class="editor-body">
          <p><b>Two separate draggable objects:</b><br>🔵 Blue dashed point = student landing/jump position.<br>🟠 Orange dashed weather image = weather position.<br>Drag either one independently.</p>
          <div id="coordRows"></div>
          <div class="editor-actions">
            <button class="copybtn" id="copyCoords">Copy</button>
            <button class="resetbtn" id="resetCoords">Reset</button>
          </div>
          <textarea class="codebox" id="codeBox" readonly></textarea>
        </div>
      </div>

      <img class="map" id="map" alt="Taiwan map">

            <div class="player-controls" aria-label="Player controls">
        
        <button type="button" class="face-control" id="boyControl" aria-label="Move boy">
          <img src="https://i.postimg.cc/sxBfLq7c/boy-stu.png" alt="Boy">
          
        </button>
        <button type="button" class="face-control" id="girlControl" aria-label="Move girl">
          <img src="https://i.postimg.cc/kGVMHzWd/girl-stu.png" alt="Girl">
          
        </button>
      </div>
<div class="route" id="route"></div>

      <img class="student" id="boy" alt="Student A Boy">
      <img class="student" id="girl" alt="Student B Girl">
<div id="currentPlace" style="display:none"></div>
      <div id="currentWeather" style="display:none"></div>
</div>

      <div class="toast" id="toast"></div>

      <div class="win" id="win">
        <div class="win-card" id="winCard">
          <div class="great-job">Great Job!</div>
          <img class="winner-picture" id="winnerPicture" src="https://i.postimg.cc/sxBfLq7c/boy-stu.png" alt="Winner">
          <button type="button" class="try-again" id="tryAgain">Try Again</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const ASSETS = {
  map: "https://i.postimg.cc/RZZXMz30/Chat-GPT-Image-Sep-22-2026-02-40-43-PM.png",
  boy: "https://i.postimg.cc/sxBfLq7c/boy-stu.png",
  girl: "https://i.postimg.cc/kGVMHzWd/girl-stu.png",
  weather: {
    cold:  "https://i.postimg.cc/MppdW8cZ/cold.png",
    cool:  "https://i.postimg.cc/P552tkLX/cool.png",
    warm:  "https://i.postimg.cc/httpSqJS/warm.png",
    hot:   "https://i.postimg.cc/MKD92GGH/hot.png",
    windy: "https://i.postimg.cc/vZZ3Qd1M/windy.png",
    cloudy:"https://i.postimg.cc/Njjpgwy5/cloudy.png",
    sunny: "https://i.postimg.cc/fRRBwh3s/sunny.png",
    rainy: "https://i.postimg.cc/FHHD9Qfz/rainy.png"
  }
};

const places = [
  {name:"Pingtung", x:51.3, y:94.4, wx:-16.7, wy:-15.3},
  {name:"Kaohsiung", x:57.1, y:71.4, wx:-25.9, wy:-5.0},
  {name:"Chiayi", x:50.4, y:56.7, wx:-23.1, wy:-4.8},
  {name:"Nantou", x:65.0, y:46.8, wx:-21.0, wy:-5.5},
  {name:"Taichung", x:66.5, y:31.3, wx:-27.4, wy:-1.2},
  {name:"Miaoli", x:42.5, y:25.2, wx:13.5, wy:-1.7},
  {name:"Hsinchu", x:51.1, y:13.3, wx:7.2, wy:2.4},
  {name:"Taoyuan", x:60.5, y:7.3, wx:-7.3, wy:-5.1},
  {name:"Taipei", x:74.2, y:3.8, wx:-0.6, wy:3.5}
];

// Independent weather-image offsets relative to each jump location.
// wx/wy are editable in Edit Mode and do NOT change where students land.
places.forEach(p => { p.wx = (p.wx ?? 4); p.wy = (p.wy ?? -8); });

const weatherList = Object.keys(ASSETS.weather);
const weatherEmoji = {
  sunny:"☀️", rainy:"🌧️", cloudy:"☁️", windy:"💨",
  cold:"🥶", cool:"🧊", warm:"🌤️", hot:"🔥"
};

const map = document.getElementById("map");
const board = document.getElementById("board");
const route = document.getElementById("route");
const boy = document.getElementById("boy");
const girl = document.getElementById("girl");
const boyControl = document.getElementById("boyControl");
const girlControl = document.getElementById("girlControl");

const currentPlace = document.getElementById("currentPlace");
const currentWeather = document.getElementById("currentWeather");
const toast = document.getElementById("toast");
const win = document.getElementById("win");
const winCard = document.getElementById("winCard");

map.src = ASSETS.map;
boy.src = ASSETS.boy;
girl.src = ASSETS.girl;

let positions = [0,0];
let weatherAt = [];
let busy = {boy:false,girl:false};

function randomWeather(){
  return weatherList[Math.floor(Math.random()*weatherList.length)];
}

function reshuffleWeather(){
  weatherAt = places.map(()=>randomWeather());
}

function makeBoard(){
  route.innerHTML = "";
  places.forEach((p,i)=>{
    const node = document.createElement("div");
    node.className = "node " + (i===0?"start ":"") + (i===places.length-1?"finish":"");
    node.style.left = p.x + "%";
    node.style.top = p.y + "%";
    node.textContent = i+1;
    node.title = `${i+1}. ${p.name}`;
    route.appendChild(node);

    // Weather image: deliberately offset from map labels.
    const w = document.createElement("img");
    w.className = "weather";
    w.id = "weather-"+i;
    w.alt = weatherList[i];
    w.style.left = Math.max(0, Math.min(92, p.x + p.wx)) + "%";
    w.style.top = Math.max(0, Math.min(94, p.y + p.wy)) + "%";
    route.appendChild(w);
  });
  updateWeatherImages();
}

function updateWeatherImages(){
  weatherAt.forEach((w,i)=>{
    const img=document.getElementById("weather-"+i);
    if(img){
      img.src=ASSETS.weather[w];
      img.alt=w;
      img.title=w;
    }
  });
}

function getRoutePoint(index){
  const p=places[index];
  return {x:p.x, y:p.y};
}

function placeStudent(el,index,side){
  const p=getRoutePoint(index);
  // Route is inset, so convert route percentage into board percentage.
  const routeLeft=13, routeTop=5, routeW=74, routeH=90;
  const x=routeLeft + p.x/100*routeW;
  const y=routeTop + p.y/100*routeH;
  el.style.left = `calc(${x}% - ${side==="boy"?42:20}px)`;
  el.style.top  = `calc(${y}% - 52px)`;
}

function updateCurrent(index, who){
  const w=weatherAt[index];
  currentPlace.textContent = `📍 ${places[index].name}${index===0?" — START":index===places.length-1?" — FINISH":""}`;
  currentWeather.textContent = `${weatherEmoji[w]} ${w.charAt(0).toUpperCase()+w.slice(1)}`;
  showToast(`${who} → ${places[index].name}: ${weatherEmoji[w]} ${w}`);
}

function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t=setTimeout(()=>toast.classList.remove("show"),1300);
}


function restartGame(event){
  if (!event || !event.currentTarget || !event.currentTarget.classList.contains('try-again')) return;
  event.preventDefault();
  event.stopPropagation();
  positions = [0,0];
  busy = {boy:false,girl:false};
  reshuffleWeather();
  updateWeatherImages();
  placeStudent(boy,0,"boy");
  placeStudent(girl,0,"girl");
  currentPlace.textContent = "📍 Pingtung — START";
  const w=weatherAt[0];
  currentWeather.textContent = `${weatherEmoji[w]} ${w.charAt(0).toUpperCase()+w.slice(1)}`;
  win.classList.remove("show");
  showToast("New game — start in Pingtung!");
}

function move(which){
  if(busy[which]) return;
  const i = which==="boy"?0:1;
  const currentIndex = positions[i];

  if(currentIndex >= places.length-1){
    showToast(`${which==="boy"?"Boy":"Girl"} is already in Taipei!`);
    return;
  }

  busy[which]=true;

  // IMPORTANT: student clicks can only move FORWARD one city.
  // They can never reset or move backward.
  const nextIndex = Math.min(currentIndex + 1, places.length - 1);
  positions[i] = nextIndex;
  reshuffleWeather();
  updateWeatherImages();

  const el=which==="boy"?boy:girl;
  el.classList.remove("moving");
  void el.offsetWidth;
  el.classList.add("moving");

  placeStudent(el,positions[i],which);
  updateCurrent(positions[i],which==="boy"?"Boy":"Girl");

  if(positions[i]===places.length-1){
    setTimeout(()=>{
      winCard.innerHTML = `
        <div class="great-job">Great Job!</div>
        <img class="winner-picture" src="${which==="boy" ? ASSETS.boy : ASSETS.girl}" alt="${which==="boy" ? "Boy" : "Girl"} winner">
        <button type="button" class="try-again" id="tryAgain">Try Again</button>`;
      win.classList.add("show");
      document.getElementById("tryAgain").addEventListener("click", restartGame);
    },800);
  }

  setTimeout(()=>busy[which]=false,800);
}

document.getElementById("tryAgain")?.addEventListener("click", restartGame);

// Clicking/tapping the map, board, route, weather, or victory background NEVER restarts the game.
board.addEventListener("click",(e)=>{
  if (e.target === board || e.target === map || e.target === route || e.target === win) {
    e.preventDefault();
    e.stopPropagation();
  }
});

boy.addEventListener("dragstart",(e)=>e.preventDefault());
girl.addEventListener("dragstart",(e)=>e.preventDefault());

boyControl.addEventListener("click",(e)=>{
  e.preventDefault();
  e.stopPropagation();
  move("boy");
});
girlControl.addEventListener("click",(e)=>{
  e.preventDefault();
  e.stopPropagation();
  move("girl");
});

function resize(){
  placeStudent(boy,positions[0],"boy");
  placeStudent(girl,positions[1],"girl");
}

reshuffleWeather();
makeBoard();
resize();
window.addEventListener("resize",resize);

// ==================== VERSION 2: ON-SCREEN EDIT MODE ====================
const editToggle = document.getElementById("editToggle");
const editor = document.getElementById("editor");
const coordRows = document.getElementById("coordRows");
const codeBox = document.getElementById("codeBox");
const copyCoords = document.getElementById("copyCoords");
const resetCoords = document.getElementById("resetCoords");
const editorHead = document.getElementById("editorHead");
const minimizeEditor = document.getElementById("minimizeEditor");

minimizeEditor.addEventListener("click",(e)=>{
  e.stopPropagation();
  editor.classList.toggle("minimized");
  minimizeEditor.textContent = editor.classList.contains("minimized") ? "+" : "−";
});

let panelDrag=false, panelDX=0, panelDY=0;
editorHead.addEventListener("pointerdown",(e)=>{
  if(e.target===minimizeEditor) return;
  panelDrag=true;
  const r=editor.getBoundingClientRect();
  const b=board.getBoundingClientRect();
  panelDX=e.clientX-r.left;
  panelDY=e.clientY-r.top;
  editor.style.right="auto";
  editor.style.left=(r.left-b.left)+"px";
  editor.style.top=(r.top-b.top)+"px";
  editorHead.setPointerCapture?.(e.pointerId);
});
editorHead.addEventListener("pointermove",(e)=>{
  if(!panelDrag) return;
  const b=board.getBoundingClientRect();
  const er=editor.getBoundingClientRect();
  let left=e.clientX-b.left-panelDX;
  let top=e.clientY-b.top-panelDY;
  left=Math.max(0,Math.min(b.width-er.width,left));
  top=Math.max(0,Math.min(b.height-er.height,top));
  editor.style.left=left+"px";
  editor.style.top=top+"px";
});
editorHead.addEventListener("pointerup",()=>panelDrag=false);

const originalPlaces = places.map(p => ({...p}));
let editMode = false;
let draggedIndex = null;

function buildCoordEditor(){
  coordRows.innerHTML = "";
  places.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="coord-row";
    row.innerHTML=`<b>${i+1}. ${p.name}</b>
      <input type="number" step="0.1" min="0" max="100" data-i="${i}" data-axis="x" value="${p.x}">
      <input type="number" step="0.1" min="0" max="100" data-i="${i}" data-axis="y" value="${p.y}">`;
    coordRows.appendChild(row);
  });
  coordRows.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const i=+inp.dataset.i, axis=inp.dataset.axis;
      places[i][axis]=Math.max(0,Math.min(100,+inp.value||0));
      redrawEditableBoard();
    });
  });
  updateCodeBox();
}

function updateCodeBox(){
  codeBox.value = "const places = [\n" + places.map((p,i)=>
    `  {name:"${p.name}", x:${Number(p.x).toFixed(1)}, y:${Number(p.y).toFixed(1)}, wx:${Number(p.wx).toFixed(1)}, wy:${Number(p.wy).toFixed(1)}}${i<places.length-1?",":""}`
  ).join("\n") + "\n];";
}

function redrawEditableBoard(){
  makeBoard();
  placeStudent(boy,positions[0],"boy");
  placeStudent(girl,positions[1],"girl");
  addCoordTags();
  attachNodeDragging();
  attachWeatherDragging();
  updateInputs();
  updateCodeBox();
}

function updateInputs(){
  coordRows.querySelectorAll("input").forEach(inp=>{
    const i=+inp.dataset.i, axis=inp.dataset.axis;
    inp.value=Number(places[i][axis]).toFixed(1);
  });
}

function addCoordTags(){
  route.querySelectorAll(".coord-tag").forEach(e=>e.remove());
  places.forEach((p,i)=>{
    const tag=document.createElement("div");
    tag.className="coord-tag";
    tag.id="tag-"+i;
    tag.style.left=`calc(${p.x}% + 18px)`;
    tag.style.top=`calc(${p.y}% + 18px)`;
    tag.textContent=`x:${Number(p.x).toFixed(1)} y:${Number(p.y).toFixed(1)}`;
    route.appendChild(tag);
  });
}

function pointerToRoutePercent(e){
  const r=route.getBoundingClientRect();
  return {
    x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),
    y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))
  };
}

function attachNodeDragging(){
  route.querySelectorAll(".node").forEach((node,i)=>{
    node.onpointerdown=(e)=>{
      if(!editMode) return;
      e.preventDefault();
      draggedIndex=i;
      node.setPointerCapture?.(e.pointerId);
      node.classList.add("dragging");
    };
    node.onpointermove=(e)=>{
      if(!editMode || draggedIndex!==i) return;
      const pt=pointerToRoutePercent(e);
      places[i].x=+pt.x.toFixed(1);
      places[i].y=+pt.y.toFixed(1);
      node.style.left=places[i].x+"%";
      node.style.top=places[i].y+"%";
      const tag=document.getElementById("tag-"+i);
      if(tag){
        tag.style.left=`calc(${places[i].x}% + 18px)`;
        tag.style.top=`calc(${places[i].y}% + 18px)`;
        tag.textContent=`x:${places[i].x.toFixed(1)} y:${places[i].y.toFixed(1)}`;
      }
      const w=document.getElementById("weather-"+i);
      if(w){
        w.style.left=Math.max(0,Math.min(92,places[i].x+places[i].wx))+"%";
        w.style.top=Math.max(0,Math.min(94,places[i].y+places[i].wy))+"%";
      }
      placeStudent(boy,positions[0],"boy");
      placeStudent(girl,positions[1],"girl");
      updateInputs();
      updateCodeBox();
    };
    node.onpointerup=()=>{
      node.classList.remove("dragging");
      draggedIndex=null;
    };
  });
}


function attachWeatherDragging(){
  route.querySelectorAll(".weather").forEach((img,i)=>{
    img.onpointerdown=(e)=>{
      if(!editMode) return;
      e.preventDefault();
      e.stopPropagation();
      img.setPointerCapture?.(e.pointerId);
      img.dataset.dragging="1";
    };
    img.onpointermove=(e)=>{
      if(!editMode || img.dataset.dragging!=="1") return;
      const pt=pointerToRoutePercent(e);
      // Save weather position as offset from its student landing point.
      places[i].wx=+(pt.x-places[i].x).toFixed(1);
      places[i].wy=+(pt.y-places[i].y).toFixed(1);
      img.style.left=Math.max(0,Math.min(92,pt.x))+"%";
      img.style.top=Math.max(0,Math.min(94,pt.y))+"%";
      updateCodeBox();
    };
    img.onpointerup=()=>{
      img.dataset.dragging="0";
    };
  });
}

editToggle.addEventListener("click",()=>{
  editMode=!editMode;
  editor.classList.toggle("show",editMode);
  board.classList.toggle("edit-on",editMode);
  editToggle.textContent=editMode?"🛠️ Edit Mode: ON":"🛠️ Edit Mode: OFF";
  if(editMode){
    buildCoordEditor();
    addCoordTags();
    attachNodeDragging();
    attachWeatherDragging();
  }
});

copyCoords.addEventListener("click",async()=>{
  updateCodeBox();
  try{
    await navigator.clipboard.writeText(codeBox.value);
    copyCoords.textContent="✓ Copied!";
    setTimeout(()=>copyCoords.textContent="Copy Coordinates",1200);
  }catch(e){
    codeBox.select();
    document.execCommand("copy");
  }
});

resetCoords.addEventListener("click",()=>{
  originalPlaces.forEach((p,i)=>Object.assign(places[i],p));
  redrawEditableBoard();
});

buildCoordEditor();

</script>

<script>
(function(){
  const gameBoard = document.querySelector(".board");
  if (!gameBoard) return;

  gameBoard.addEventListener("click", function(e){
    const target = e.target;
    const allowed =
      target.closest?.(".face-control") ||
      target.closest?.("#editToggle") ||
      target.closest?.(".try-again") ||
      (gameBoard.classList.contains("edit-on") &&
        (target.closest?.(".node") || target.closest?.(".weather") || target.closest?.(".coord-tag")));

    if (!allowed) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }, true);
})();
</script>

</body>

/* V11: During normal gameplay, ONLY the two students and Edit Mode button are clickable. */
.board .route,
.board .node,
.board .weather,
.board .coord-tag,
.board .place-label,
.board .legend,
.board .map-img {
  pointer-events: none;
}
#editToggle {
  pointer-events: auto;
  cursor: pointer;
}

.board.edit-on .node,
.board.edit-on .weather,

  pointer-events: auto;
}
